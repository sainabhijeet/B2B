name: b2b_business_mobile_theme
description: Production-ready Flutter B2B mobile commerce UI theme with mock data and API-ready screens.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/banners/
    - assets/images/products/
    - assets/images/categories/
    - assets/images/brands/
