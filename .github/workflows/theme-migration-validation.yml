name: Theme migration validation

on:
  pull_request:
    paths:
      - 'backend/src/database/**'
      - 'backend/src/scripts/theme-migration-verify.ts'
      - 'backend/package-lock.json'
  push:
    branches: [main]

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_migration_verify
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d saas_migration_verify"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run migration:verify
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: saas_migration_verify
          MIGRATION_VERIFY_FRESH_DATABASE_URL: postgres://postgres:postgres@localhost:5432/saas_migration_verify
