allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
    configurations.configureEach {
        resolutionStrategy.force "androidx.core:core:1.13.1"
        resolutionStrategy.force "androidx.core:core-ktx:1.13.1"
        resolutionStrategy.force "androidx.activity:activity:1.8.1"
        resolutionStrategy.force "androidx.activity:activity-ktx:1.8.1"
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
